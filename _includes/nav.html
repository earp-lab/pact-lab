<nav>
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">PACT<span>&nbsp;Lab</span></a>
    <ul class="navlinks">
      <li class="hasmenu">
        <a href="{{ '/' | relative_url }}#services">What we do</a><button type="button" class="caretbtn" aria-expanded="false" aria-label="Show more under What we do">&#9662;</button>
        <ul class="submenu">
          <li><a href="{{ '/' | relative_url }}#model">How we work</a></li>
          <li><a href="{{ '/' | relative_url }}#governance">Governance</a></li>
        </ul>
      </li>
      <li><a href="{{ '/people/' | relative_url }}"{% if page.nav == 'people' %} class="current"{% endif %}>People</a></li>
      <li><a href="{{ '/resources/' | relative_url }}"{% if page.nav == 'resources' %} class="current"{% endif %}>Resources</a></li>
      <li><a href="{{ '/publications/' | relative_url }}"{% if page.nav == 'publications' %} class="current"{% endif %}>Publications</a></li>
      <li><a href="{{ '/events/' | relative_url }}"{% if page.nav == 'events' %} class="current"{% endif %}>News &amp; events</a></li>
      <li><a href="{{ '/contact/' | relative_url }}"{% if page.nav == 'contact' %} class="current"{% endif %}>Contact</a></li>
    </ul>
  </div>
</nav>

<script>
(function(){
  var li = document.querySelector('.navlinks .hasmenu');
  if(!li) return;
  var btn = li.querySelector('.caretbtn');
  function close(){ li.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
  btn.addEventListener('click', function(e){
    e.preventDefault();
    var open = li.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('click', function(e){ if(!li.contains(e.target)) close(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });
  li.addEventListener('focusout', function(){
    window.setTimeout(function(){ if(!li.contains(document.activeElement)) close(); }, 0);
  });
})();
</script>
