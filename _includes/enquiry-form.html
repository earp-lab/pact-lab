<div class="enqform" id="enquiry">
  <p class="enqintro">Answer what applies and the form will open a pre-addressed email with your answers set out. Nothing is sent until you send it.</p>

  <label class="enqlabel" for="q_who">Who is getting in touch</label>
  <select id="q_who" class="enqfield">
    <option value="">Select one</option>
    <option>A research team at NUS Medicine or NUHS</option>
    <option>A researcher elsewhere</option>
    <option>A patient, caregiver, or member of the public</option>
    <option>A patient group or community organisation</option>
    <option>Other</option>
  </select>

  <label class="enqlabel" for="q_name">Name</label>
  <input id="q_name" class="enqfield" type="text" autocomplete="name">

  <label class="enqlabel" for="q_affil">Department, institution, or group (if applicable)</label>
  <input id="q_affil" class="enqfield" type="text">

  <label class="enqlabel" for="q_stage">Stage of the work (for research teams)</label>
  <select id="q_stage" class="enqfield">
    <option value="">Select one</option>
    <option>An idea, nothing written yet</option>
    <option>Protocol in development</option>
    <option>Grant application in preparation</option>
    <option>Funded, not yet started</option>
    <option>Study underway</option>
    <option>Analysis, translation, or dissemination</option>
  </select>

  <label class="enqlabel" for="q_need">What you are looking for</label>
  <select id="q_need" class="enqfield">
    <option value="">Select one</option>
    <option>Advice on what involvement my study needs</option>
    <option>Help costing involvement into a grant application</option>
    <option>Review of participant-facing materials</option>
    <option>Public attitudes study through HOPS</option>
    <option>A consultation panel or focus group</option>
    <option>Co-design with patients or the public</option>
    <option>Access to a condition-specific patient group</option>
    <option>Training or certification</option>
    <option>To take part in research as a patient, caregiver, or member of the public</option>
    <option>Not sure yet</option>
  </select>

  <label class="enqlabel" for="q_deadline">Any fixed date to work to, such as a grant deadline</label>
  <input id="q_deadline" class="enqfield" type="text" placeholder="e.g. NMRC submission, 30 November">

  <label class="enqlabel" for="q_detail">Briefly, what is the study or the request about</label>
  <textarea id="q_detail" class="enqfield" rows="4"></textarea>

  <button type="button" class="btn" id="enqsend">Open email with these answers</button>
  <p class="enqnote">This opens your own email programme. If it does not, write to <a href="mailto:yuxinliu@nus.edu.sg">yuxinliu@nus.edu.sg</a> directly.</p>
</div>

<script>
(function(){
  var b = document.getElementById('enqsend');
  if(!b) return;
  b.addEventListener('click', function(){
    function v(id){ var e=document.getElementById(id); return e && e.value ? e.value.trim() : ''; }
    var rows = [
      ['Who is getting in touch', v('q_who')],
      ['Name', v('q_name')],
      ['Department, institution, or group', v('q_affil')],
      ['Stage of the work', v('q_stage')],
      ['What they are looking for', v('q_need')],
      ['Fixed dates', v('q_deadline')]
    ];
    var body = 'PACT Lab enquiry\n\n';
    rows.forEach(function(r){ if(r[1]) body += r[0] + ': ' + r[1] + '\n'; });
    var d = v('q_detail');
    if(d) body += '\nAbout the study or request:\n' + d + '\n';
    var subj = 'PACT Lab enquiry' + (v('q_need') ? ' — ' + v('q_need') : '');
    window.location.href = 'mailto:yuxinliu@nus.edu.sg?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body);
  });
})();
</script>
