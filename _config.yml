title: "PACT Lab — Patient and public Action, Collaboration, and Trust in Research"
description: "PACT Lab is a joint CBmE–NUHS platform for patient and public involvement and engagement in research across NUS Medicine and the National University Health System."

# When the site is served from a custom domain (e.g. https://pactlab.sg),
# set url to that domain and leave baseurl empty.
# While it is served from GitHub Pages at earp-lab.github.io/pact-lab,
# set baseurl to "/pact-lab".
url: ""
baseurl: "/pact-lab"
future: true

collections:
  events:
    output: true
    permalink: /events/:name/

defaults:
  - scope:
      path: ""
      type: "events"
    values:
      layout: "event"
      nav: "events"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
