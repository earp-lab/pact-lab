# PACT Lab — resources
#
# HOW TO EDIT
#   Resources are grouped into sections. Each section has a title, an optional
#   intro, and a list of items. Each item has:
#     type      the small orange label, e.g. "Guidance", "Training", "Report"
#     title     the resource name
#     blurb     one or two sentences on what it is
#     url       where it links to. For a PDF, upload it to assets/docs/ and
#               write "/assets/docs/filename.pdf". Leave out if not ready.
#     pending   text shown when there is no url yet, e.g. "Coming soon"
#     note      small print shown under an item that does have a url, optional
#
#   To ADD an item: copy a block, keep the indentation exactly.
#   To ADD a section: copy a whole section block.
#   Anything with an apostrophe or colon must stay inside the double quotes.

sections:
  - title: "Governing documents"
    intro: "The principles, standards, and agreements under which the PACT Lab operates."
    items:
      - type: "Governing document"
        title: "Governing Philosophy"
        blurb: "The principles and rationale underpinning the PACT Lab's approach to patient and public involvement."
        pending: "Coming soon"
      - type: "Guidance"
        title: "Best Practices for PPIE"
        blurb: "Practical standards and procedures for involving patients and the public in research responsibly and consistently."
        pending: "Coming soon"

  - title: "Training"
    intro: "Materials for researchers seeking certification, and for patients, caregivers, and members of the public taking part in research."
    items:
      - type: "Training"
        title: "Researcher certification"
        blurb: "Modules covering when and how to involve patients and the public, what counts as meaningful involvement, and how to budget for it."
        pending: "In development"
      - type: "Training"
        title: "Patient and public pathway"
        blurb: "A tiered pathway: self-advocacy and navigating the health system, then representing others with the same condition, then formal advocacy roles."
        pending: "In development"

  - title: "For research teams"
    intro: "How to request the PACT Lab's support and what to expect."
    items:
      - type: "Service information"
        title: "What we offer, and when"
        blurb: "What the Lab can support now, what follows in the first year, and what follows in the second, with guidance on requesting support and costing involvement into grants."
        url: "/services/"
      - type: "Method"
        title: "The CREP methodology"
        blurb: "Collective Reflective Equilibrium in Practice: how public input is taken from data to defensible policy and translation recommendations."
        url: "/methods/crep/"
      - type: "Mapping"
        title: "Mapping PPIE across NUS Medicine and NUHS"
        blurb: "Which involvement resources exist across the two institutions, who manages them, and how access is decided."
        url: "/mapping/"
      - type: "Public panel"
        title: "The Health Opinion Panel Singapore"
        blurb: "A demographically representative public panel of over 4,000 members, and how research teams can request access to it."
        url: "/hops/"
