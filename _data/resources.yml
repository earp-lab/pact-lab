        pending: "In development"

  - title: "For research teams"
    intro: "How to request PACT's support and what to expect."
    items:
      - type: "Service information"
        title: "Service Menu and Access"
        blurb: "How research teams can request PACT's support, what services are available, and how PPIE can be costed into grant budgets."
        pending: "Coming soon"
      - type: "Method"
        title: "The CREP Methodology"
        blurb: "Collective Reflective Equilibrium in Practice: the framework PACT uses to translate public input into justifiable policy and translation recommendations."
        pending: "Reference paper linked under Our method"
