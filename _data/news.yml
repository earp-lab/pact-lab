items:
  - date: 2026-08-03
    title: "Imperial Global Connect Fund award for a PERC–PACT training partnership"
    body: "The Imperial Global Connect Fund has awarded £7,935 to Prof Helen Ward (Imperial College London), in collaboration with A/Prof Brian D. Earp (NUS, Co-Director of PACT Lab), for 'Building Patient and Public Involvement and Engagement (PPIE) capacity in Singapore: An Imperial PERC–NUS PACT partnership for community-centred population and clinical health research'. The award supports PACT Lab's work with the Patient Experience Research Centre at Imperial on training materials for researchers and for patients and the public, and runs to July 2027."
