# PACT Lab — people
#
# HOW TO EDIT
#   Each entry below has: name, initials, and optionally photo, role,
#   affiliation, blurb, profile.
#     initials    shown in the circle if there is no photo (e.g. "TBA", "SRF")
#     photo       a file in assets/images/people/ — write just the file name,
#                 e.g. "people/jane-tan.jpg". Leave it out and the initials show.
#     role        the PACT role, e.g. "Steering Committee"
#     affiliation the person's institutional title
#     blurb       one or two sentences, optional
#     profile     a full URL to their institutional page, optional
#
#   To ADD someone: copy an existing block, keep the indentation exactly,
#   and put it where you want them to appear in the group.
#   To REMOVE someone: delete their whole block.
#   Anything with an apostrophe or colon must stay inside the double quotes.

