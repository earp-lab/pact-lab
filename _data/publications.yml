# PACT Lab — publications
#
# HOW TO EDIT
#   One list. Each entry carries a theme, and two yes/no flags that decide
#   which page it appears on.
#
#     authors   Surname, A. B., & Surname, C. D. — commas between all authors,
#               ampersand before the last. Wrap any author who appears on the
#               People page in <span class="pactauthor">…</span> so they are
#               shown in bold, e.g.
#                 "Davies, R., Ives, J., & <span class=\"pactauthor\">Dunn, M.</span>"
#     year      publication year
#     title     SENTENCE CASE (only the first word, proper nouns, and acronyms
#               capitalised), no full stop at the end
#     venue     journal name only
#     volume    e.g. "35(7)"
#     pages     e.g. "652–663" (en dash, not a hyphen)
#     doi       full https://doi.org/... address; the title links to it
#     note      short label such as "Open access", optional
#
#     theme     one of: foundations | methods | studies
#                 foundations  why involvement, its ethics, justification, governance
#                 methods      how it is done and studied, including CREP and HOPS
#                 studies      involvement in practice: surveys, qualitative work, co-design
#     selected  true to show it on the Selected publications page
#     pact      true if it came out of PACT Lab's own funded work; these appear
#               on the Outputs page, grouped by year
#
#   To ADD one: copy a block, keep the indentation exactly. Order in this file
#   does not matter — both pages sort themselves.
#   Anything with an apostrophe or colon must stay inside the double quotes.

